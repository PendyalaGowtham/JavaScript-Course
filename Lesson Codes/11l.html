
<!DOCTYPE html>

<body>
    <script >
        function minMax(nums){
           
            const minMaxObj = { 
                min : nums[0],
                max :  nums[0]
            };


            for( let i=0; i < nums.length; i++ ){

                const value = nums[i]

                if(value > minMaxObj.max ){
                    minMaxObj.max = value;
                }

                 if(value < minMaxObj.min ){
                    minMaxObj.min = value;
                }
            }
            return minMaxObj;
        }
        console.log(minMax([-1,9,4]));
        console.log(minMax([0,-2,4,]));


    </script>
</body>
</html>
