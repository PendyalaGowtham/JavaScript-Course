
<!DOCTYPE html>
<html>
    <head>
        <title> DOM Projects [GM]</title>


        <style>

            body {
                font-family: Arial;
            }
             
            .js-sub-btn{
                background-color: black;
                border-radius: 30px;
                color: whitesmoke;
                font-weight: bold;
                padding: 9px 15px;
                cursor: pointer;
                border: none;
                margin-bottom: 30px;
            }

            .is-subscribed{
                background-color: rgb(231, 231, 231);
                color: black;

            }

            .js-cost{
                padding: 10px 11px;
                font-size: 15px;
            }

            .calc-btn{
                padding: 11.5px 12px;
                border: none;
                color: white;
                background-color: green;
                margin-left: 2px;;
                font-size: 16px;
                cursor: pointer;
            }
            
        </style>
    </head>

<body>
      
    <p> YouTube Subscribe Button</p>
    <button onclick="subscribe();"  class = 'js-sub-btn' > Subscribe </button>

    <p > Amazon Shipping Calculator</p>
    <p> Orders under $40 = +$10 shipping.</p>
    <p> Orders over $40 = FREE shipping</p>

    <input placeholder="Cost of Order" class="js-cost" onkeydown="verifykey(event)">
    

     <button onclick="calculateTotal()" class="calc-btn" >Calculate</button>
     <p class="js-total-cost"> </p>

    <script>
     
     function subscribe(){
         const buttonElement = document.querySelector('.js-sub-btn') 

        if(buttonElement.innerHTML === 'Subscribe'){
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
        
        }else{
            document.querySelector('.js-sub-btn').innerHTML = 'Subscribe';
            buttonElement.classList.remove('is-subscribed');

        }

        }

    function calculateTotal(){
    const inputCost = document.querySelector('.js-cost');
    let cost = Number(inputCost.value);
    if( cost < 40){
         cost = cost +  10;
    }
    console.log(cost);
    
     document.querySelector('.js-total-cost').innerHTML = `$ ${cost}`;

    }

     function verifykey(event){
        if(event.key === 'Enter'){
            calculateTotal();
        }
    
     }
     

    </script>


</body>


</html>
