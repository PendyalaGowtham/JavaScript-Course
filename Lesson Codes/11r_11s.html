    <script>
       
    function removeEgg(foods){

        let result= ['egg','egg','egg']
        for(let i = 0; i < foods.length; i++){

            if(foods[i] === 'egg' && result.length > 1){
                foods.splice(i,1);
                result.splice(0,1);
                console.log(result);
            }
        }
        return foods;
    }

    console.log( removeEgg(['eagle','apple','egg','test','egg','egg','egg','rose','egg']));

   </script>
