
<!DOCTYPE html>

<body>
    <script>
       
    function removeEgg(foods){

        let revfoods = foods.reverse();
        let result = [];
        let eggCount = 0;

        for(let i = 0; i < revfoods.length; i++){

            if(revfoods[i] === 'egg' && eggCount < 2){
                eggCount++;
                continue;
            }
            result.push(revfoods[i]);
        }
        return result.reverse();
    }

    //console.log( removeEgg(['eagle','apple','egg','test','egg','egg','egg','rose','egg']));
    console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));
    //console.log(removeEgg(['ham',  'egg', 'egg','apple' ]));
   </script>
</body>
