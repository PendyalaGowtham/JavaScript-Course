<body>
    <script >

        function addOne(array1, array2){

            let newArray= [];
            for( let i=0; i < array1.length; i++ ){
                newArray.push(array1[i]+ array2[i]);
            }
            return newArray;
        }

        console.log(addOne([1,4,4],[2,1,2]));
        console.log(addOne([0,4,4,],[2,1,2]));


    </script>
