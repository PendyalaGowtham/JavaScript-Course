    <script >
        function countPositive(nums){
            let postiveNum = 0;
            for( let i=0; i < nums.length; i++ ){
                if(nums[i] > 0){
                    postiveNum += 1;
                }
            }
            return postiveNum;
        }
        console.log(countPositive([-1,4,4]));
        console.log(countPositive([0,-2,4,]));


    </script>
