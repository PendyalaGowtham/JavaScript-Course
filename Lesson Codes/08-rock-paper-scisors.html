
<!DOCTYPE html>
<html>
    <head>
        <title> Rock Paper Scissor</title>
    </head>

    <body>
            <p> Rock Paper Scissors Game</p>
            <button onclick="  Game('Rock');"> Rock </button>
            <button onclick="  Game('Paper');">Paper</button>
            <button onclick=" Game('Scissor'); " >Scissor</button>
            <button onclick="resetScore()" >Reset Score</button>

        <script>

        function resetScore() {
            score.Wins = 0;
            score.Losses = 0;
            score.Ties = 0;
            localStorage.removeItem('SCORE');
        }

    
        let score = JSON.parse(localStorage.getItem('SCORE')) ||  { Wins:0, Losses:0, Ties:0 };

        // if (score === null ){    // if(!score)
        //       score = {
        //         Wins:0,
        //         Losses:0,
        //         Ties:0
        //      };
        // }

//        console.log(score);

       //   console.log(localStorage.getItem('SCORE'));

          function Game(playermove)
          {
                
                const computerMove = pickComputerMove();
                let result = ' ';

                if (playermove === 'Scissor'){
                    if ( computerMove === 'Rock'){
                        result = 'LOOSE';
                    }else if ( computerMove === 'Paper' ){
                        result = 'WIN';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'TIE'  ;
                    }
                }else if(playermove === 'Paper'){
                    if ( computerMove === 'Rock'){
                        result = 'WIN';
                    }else if ( computerMove === 'Paper' ){
                        result = 'TIE';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'LOOSE'  ;
                    }
                }
                else if(playermove === 'Rock'){
                    if ( computerMove === 'Rock'){
                        result = 'TIE';
                    }else if ( computerMove === 'Paper' ){
                        result = 'LOOSE';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'WIN'  ;
                    }
                }
              
              if (result === 'WIN' ){
                score.Wins += 1;
              }else if(result === 'LOOSE' ){
                 score.Losses += 1;
              }else if(result === 'TIE'){
                  score.Ties += 1;              
              }

                
                localStorage.setItem('SCORE', JSON.stringify(score) );

                alert(`Your Move : ${playermove} , Computer Move :  ${computerMove} : YOU  ${result}.
                      Wins: ${score.Wins}, Losses: ${score.Losses}, Ties: ${score.Ties}`) 
                 console.log(result);
                 console.log(score);
             }

           

          function pickComputerMove() {
                   const randomNumber1 = Math.random();
                  //  console.log(randomNumber1);
                   
                    let computerMove = ' ';

                    if ( randomNumber1 > 0  && randomNumber1 < 1/3){
                        computerMove = 'Rock';
                        }else if(randomNumber1 >= 1/3  && randomNumber1 < 2/3 ){
                        computerMove = 'Paper';
                        }else if(randomNumber1 >= 2/3  && randomNumber1 <= 1 ){
                        computerMove = 'Scissor';
                        }
                return computerMove;
          }
            
        </script>
    </body>
</html>
