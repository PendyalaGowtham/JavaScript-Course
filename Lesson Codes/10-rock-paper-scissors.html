
<!DOCTYPE html>
<html>
    <head>
        <title> Rock Paper Scissor</title>

            <link rel="stylesheet" href="10-rock-paper-scissors.css">
    </head>

    <body>
            <p class="game-header"> Rock Paper Scissors Game</p>
            <button onclick="  Game('Rock');" class="game-btns"> ✊ </button>
            <button class="game-btns" onclick="  Game('Paper');">🖐️</button>
            <button class="game-btns" onclick=" Game('Scissor'); " >✌️</button>

            <p class="js-result"> </p>

            <p class="js-move" > </p>

            <p class="js-score"> getting from DOM </p>

            <button  class='reset-score'onclick="resetScore()" >Reset Score</button>

        <script src="10-rock-paper-scissors.js">       </script>
    </body>
</html>
