
<!DOCTYPE html>
<html>
    <head>
        <title> Rock Paper Scissor</title>
    </head>

    <body>
            <p> Rock Paper Scissors Game</p>
            <button onclick="  Game('Rock');"> Rock </button>
            <button onclick="  Game('Paper');">Paper</button>
            <button onclick=" Game('Scissor'); " >Scissor</button>

        <script>

          function Game(playermove){
                
                const computerMove = pickComputerMove();
                let result = ' ';

                if (playermove === 'Scissor'){
                    if ( computerMove === 'Rock'){
                        result = 'YOU LOOSE';
                    }else if ( computerMove === 'Paper' ){
                        result = 'WIN';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'TIE'  ;
                    }
                }else if(playermove === 'Paper'){
                    if ( computerMove === 'Rock'){
                        result = 'YOU WIN';
                    }else if ( computerMove === 'Paper' ){
                        result = 'TIE';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'YOU LOOSE'  ;
                    }
                }
                else if(playermove === 'Rock'){
                    if ( computerMove === 'Rock'){
                        result = 'TIE';
                    }else if ( computerMove === 'Paper' ){
                        result = 'YOU LOOSE';
                    }else if ( computerMove === 'Scissor' ){
                        result = 'WIN'  ;
                    }
                }
                alert(`Your Move : ${playermove} , Computer Move :  ${computerMove} :  ${result}. `) 
                 console.log(result);
               }


          function pickComputerMove() {
                   const randomNumber1 = Math.random();
                    console.log(randomNumber1);
                   
                    let computerMove = ' ';

                    if ( randomNumber1 > 0  && randomNumber1 < 1/3){
                        computerMove = 'Rock';
                        }else if(randomNumber1 >= 1/3  && randomNumber1 < 2/3 ){
                        computerMove = 'Paper';
                        }else if(randomNumber1 >= 2/3  && randomNumber1 <= 1 ){
                        computerMove = 'Scissor';
                        }
                return computerMove;
          }
            
        </script>
    </body>
</html>
