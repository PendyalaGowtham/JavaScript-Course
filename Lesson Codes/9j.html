<!DOCTYPE html>
<html>
  <head></head>
  <body>

       <p class="show-output"></p>
    <p>

      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        // Note: eval() takes a string and runs it as code.
        // Avoid using eval() in real world projects since
        // it can potentially be given harmful code to run.
        // Only use eval() for learning purposes.
        calculation = eval(calculation);
        console.log(calculation);
          displayValue();
                localStorage.setItem('calc',calculation);
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = 0;
        console.log(calculation);

        localStorage.setItem('calc',calculation);
       // localStorage.removeItem('calc')

        displayValue()
      ">Clear</button>
    </p>

 
    <script>
      let calculation = localStorage.getItem('calc') || '';


      function updateCalculation(value) {
        calculation += value;
        console.log(calculation);
        localStorage.setItem('calc',calculation);

        displayValue()
      }

      function displayValue(){
        document.querySelector('.show-output').innerHTML = calculation;
      }
    </script>
  </body>
</html>
