
<!DOCTYPE html>
<html>
    <head>
        <title> 11 i</title> 
    </head>

<body>
    <script >

        function addOne(array, num){

            let newArray= [];
            for( let i=0; i < array.length; i++ ){
                newArray.push(array[i]+ num);
            }
            return newArray;
        }

        console.log(addOne([-2,-1,0,99],100))

    </script>
</body>
</html>
